log_format fdeclub_safe '$time_iso8601 $request_method $uri $status $body_bytes_sent';
server {
  access_log /var/log/nginx/fdeclub-access.log fdeclub_safe;
  listen 80;
  listen [::]:80;
  server_name fdeclub.net www.fdeclub.net;
  location ^~ /.well-known/acme-challenge/ { root /var/www/fdeclub-acme; }
  location / { return 308 https://fdeclub.net$request_uri; }
}
server {
  access_log /var/log/nginx/fdeclub-access.log fdeclub_safe;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.fdeclub.net;
  ssl_certificate /etc/letsencrypt/live/fdeclub.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fdeclub.net/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  return 308 https://fdeclub.net$request_uri;
}
server {
  access_log /var/log/nginx/fdeclub-access.log fdeclub_safe;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name fdeclub.net;
  ssl_certificate /etc/letsencrypt/live/fdeclub.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fdeclub.net/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:FDECLUB:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security 'max-age=31536000' always;
  client_max_body_size 32k;
  location / {
    proxy_pass http://127.0.0.1:3216;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }
}
